[package]
name = "tidb-allocator-stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
all = "warn"

[dependencies]
# Keep the control ABI identical to the allocator owned by TiKV's `tikv_alloc`.
# Linking a second jemalloc version makes stats/profile mallctl target a
# different native library than the process allocator.
tikv-jemalloc-sys = { version = "0.6.1", optional = true, features = ["profiling"] }

[features]
default = []
jemalloc = ["dep:tikv-jemalloc-sys"]
